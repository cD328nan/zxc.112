<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa">
<title>电脑工具箱</title>
<script>
(function(){
  try{
    var t = localStorage.getItem('cx_theme');
    if(!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hd">
  <div class="hd-inner">
    <div class="hd-left">
      <div class="hd-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="12" rx="2"/>
          <line x1="8" y1="20" x2="16" y2="20"/>
          <line x1="12" y1="16" x2="12" y2="20"/>
        </svg>
      </div>
      <h1>电脑工具箱</h1>
    </div>
    <div class="hd-right">
      <button class="hd-btn" id="themeBtn" aria-label="切换主题">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>
        </svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M20 15A8.5 8.5 0 0 1 9 4a8.5 8.5 0 1 0 11 11z"/>
        </svg>
      </button>
      <button class="hd-btn" id="settingsBtn" aria-label="打开设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <line x1="4" y1="7" x2="20" y2="7"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="17" x2="20" y2="17"/>
          <circle cx="9" cy="7" r="2"/>
          <circle cx="15" cy="12" r="2"/>
          <circle cx="9" cy="17" r="2"/>
        </svg>
      </button>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main>
  <div class="content" id="content"></div>
</main>

<!-- 长按浮层 -->
<div class="tip-pop" id="tipPop" hidden>
  <div class="tip-pop-inner">
    <div class="tip-pop-title" id="tipTitle"></div>
    <div class="tip-pop-text" id="tipText"></div>
  </div>
</div>

<!-- 设置侧边栏 -->
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-mask" id="drawerMask"></div>
  <div class="drawer-panel">
    <div class="drawer-head">
      <h2>设置</h2>
      <button class="hd-btn" id="drawerClose" aria-label="关闭设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="drawer-body">

      <div class="set-group">
        <div class="set-label">主题模式</div>
        <div class="set-opts" data-key="mode">
          <button class="set-opt" data-v="light">浅色</button>
          <button class="set-opt" data-v="dark">深色</button>
          <button class="set-opt" data-v="auto">跟随系统</button>
        </div>
      </div>

      <div class="set-group">
        <div class="set-label">主题色</div>
        <div class="color-row" id="colorRow">
          <button class="color-dot" data-c="#4d79ff" style="--c:#4d79ff"></button>
          <button class="color-dot" data-c="#7c5cf7" style="--c:#7c5cf7"></button>
          <button class="color-dot" data-c="#e04f7a" style="--c:#e04f7a"></button>
          <button class="color-dot" data-c="#ff8a4d" style="--c:#ff8a4d"></button>
          <button class="color-dot" data-c="#1fb56c" style="--c:#1fb56c"></button>
          <button class="color-dot" data-c="#0aa5b5" style="--c:#0aa5b5"></button>
          <button class="color-dot" data-c="#e6a020" style="--c:#e6a020"></button>
          <label class="color-dot color-custom" aria-label="自定义颜色">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M12 2.5s-7 7.3-7 12.5a7 7 0 0 0 14 0C19 9.8 12 2.5 12 2.5z"/>
            </svg>
            <input type="color" id="colorInput" value="#4d79ff">
          </label>
        </div>
      </div>

      <div class="set-group">
        <div class="set-label">排列样式</div>
        <div class="set-opts" data-key="layout">
          <button class="set-opt" data-v="grid">网格</button>
          <button class="set-opt" data-v="list">列表</button>
          <button class="set-opt" data-v="tile">密排</button>
        </div>
      </div>

      <div class="set-group">
        <div class="set-label">卡片圆角 <span class="set-val" id="radiusVal">14px</span></div>
        <input type="range" class="set-range" id="radiusRange" min="0" max="24" step="2" value="14">
      </div>

      <div class="set-group">
        <div class="set-label">字体大小 <span class="set-val" id="fsVal">标准</span></div>
        <input type="range" class="set-range" id="fsRange" min="0" max="3" step="1" value="1">
      </div>

      <div class="set-group">
        <div class="set-row">
          <div class="set-label">动效</div>
          <button class="set-switch active" data-key="motion" id="motionSwitch">
            <span class="set-switch-dot"></span>
          </button>
        </div>
      </div>

      <div class="set-group">
        <div class="set-row">
          <div class="set-label">渐变背景</div>
          <button class="set-switch" data-key="gradient" id="gradientSwitch">
            <span class="set-switch-dot"></span>
          </button>
        </div>
      </div>

      <button class="set-reset" id="resetBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        恢复默认
      </button>

      <div class="drawer-foot">
        <div class="drawer-foot-name">关于开发者：yui-皓（qq:2144782663）</div>
        <div class="drawer-foot-tip">工具箱版本：1.2a</div>
      </div>

    </div>
  </div>
</aside>

<script src="app.js"></script>
</body>
</html>
